schema_version: 1
project:
  name: Vet Space Owner Web
  evidence_level: repository_inferred
  commit: 0308862f9d870ce387a7dbb9cc0055a6796906d0
  owner: unassigned
approvals:
  core: {status: pending, approver: null, approved_at: null, evidence: null, fingerprint: null}
  scope: {status: pending, approver: null, approved_at: null, evidence: null, fingerprint: null}
policy:
  mandatory_core_events: &core_events [pull_request, main_push, release_candidate]
scope:
  included:
    - Clinic-scoped sign-in and cabinet access from an invitation link.
    - Owner visit form, optional questionnaire answers and attachment retry.
    - Request and response handling in the owner proxy.
  environments:
    - {id: owner_dom, purpose: Vitest and happy-dom exercising React components with controlled API responses.}
    - {id: owner_proxy, purpose: Vitest in Node exercising the proxy handler with controlled upstream responses.}
    - {id: owner_browser, purpose: 'Playwright Chromium against disposable Next.js, FastAPI, PostgreSQL and attachment storage.'}
  real_dependencies: [Owner React components and transport, Next.js request objects and owner proxy handler, Chromium and the isolated API stack for E2E]
  stubbed_dependencies:
    - {name: Upstream owner API, reason: Current component and proxy checks supply controlled responses or API method stubs.}
    - {name: Browser platform navigation, reason: Current sign-in test observes the requested navigation through a fake adapter.}
  test_data: Use only synthetic clinic links, owner sessions, pets, visit requests and attachments.
  not_core:
    - Live Telegram, staff workflows, accessibility audits and performance budgets are outside this initial draft.
  exclusions: []
capabilities:
  - id: CAP-OWNER-CLINIC-SESSION
    name: Clinic-scoped cabinet access
    core: true
    decision: proposed
    risk: critical
    why: Showing a cabinet from another clinic would expose private owner and animal information.
    outcome: A clinic invitation presents that clinic and successful sign-in opens the cabinet for the same clinic.
    layers: [frontend, proxy, api, database]
    evidence: Repository docs/PROJECT.md, docs/prd/2026-10-27_owner-cabinet_prd.md and tests/integration/owner-scenarios.test.tsx.
    owner: unassigned
  - id: CAP-OWNER-VISIT
    name: Owner visit submission and recovery
    core: true
    decision: proposed
    risk: high
    why: A lost or duplicate request can delay care or create extra work for the clinic.
    outcome: The selected animal gets one request with the problem, proposed time and answered questions. A file retry preserves the existing request.
    layers: [frontend, proxy, api, database]
    evidence: Repository docs/PROJECT.md, docs/prd/2026-11-07_booking-by-problem_prd.md and tests/integration/visit-request-form.test.tsx.
    owner: unassigned
  - id: CAP-OWNER-PROXY
    name: Owner proxy boundary
    core: false
    decision: proposed
    risk: high
    why: Forwarding staff credentials or caching private downloads risks exposing data across audiences.
    outcome: The proxy handles owner traffic with owner credentials and preserves private download responses.
    layers: [proxy]
    evidence: Repository docs/architecture/owner-web.md and tests/secure/owner-boundary.test.ts.
    owner: unassigned
features:
  - id: FEAT-OWNER-CLINIC-SESSION
    module: Owner identity
    feature: Sign in via a clinic invitation
    places: ['apps/owner-web/src/app/join/[code]/page.tsx', apps/owner-web/src/app/cabinet/page.tsx, packages/owner-features/src/components/join-form.tsx]
    expected: The invitation shows the selected clinic. Sign-in sends its code and enters its cabinet.
  - id: FEAT-OWNER-VISIT
    module: Owner visits
    feature: Create a request and recover from a partial upload failure
    places: [packages/owner-features/src/components/visit-request-form.tsx, packages/owner-features/src/api.ts]
    expected: A nonblank problem is required, only answered questions are sent, and retry uploads only failed files.
  - id: FEAT-OWNER-PROXY
    module: Owner HTTP proxy
    feature: Scope credentials and prevent caching for private downloads
    places: ['apps/owner-web/src/app/api/[...path]/route.ts', packages/web-proxy/src/index.ts]
    expected: The proxy forwards only the owner cookie and preserves download bytes with no-store caching policy.
  - id: FEAT-OWNER-CABINET-TO-VISIT
    module: Owner cabinet
    feature: Sign in and submit a request through the deployed application paths
    places: [apps/owner-web/src/app/cabinet/page.tsx, 'apps/owner-web/src/app/api/[...path]/route.ts', apps/api/src/vetdietderm_api/owners/router.py, apps/api/src/vetdietderm_api/visits/router.py]
    expected: A request for a pet from the invited clinic remains visible after the cabinet reloads.
checks:
  - id: CHECK-OWNER-CLINIC-SIGN-IN
    feature_id: FEAT-OWNER-CLINIC-SESSION
    capability_ids: [CAP-OWNER-CLINIC-SESSION]
    scenario: Open clinic A's invitation while the controlled session response identifies clinic B, then sign in to clinic A.
    expected: Clinic A is displayed, clinic B is absent, the login sends clinic A's code and the navigation adapter receives /cabinet.
    oracle: Clinic-link contract in docs/PROJECT.md and fixed clinic codes and headings from the test fixture.
    level: integration
    core_smoke: false
    environment: owner_dom
    real: [Join form, React DOM interaction, Owner HTTP client]
    stubbed: [Upstream owner API, Browser platform navigation]
    data: Two synthetic clinic codes and disposable test credentials.
    triggers: [local_change, pull_request]
    blocking_on: []
    safe_in_production: false
    status: implemented
    test_ref: tests/integration/owner-scenarios.test.tsx
    owner: unassigned
  - id: CHECK-OWNER-VISIT-FORM
    feature_id: FEAT-OWNER-VISIT
    capability_ids: [CAP-OWNER-VISIT]
    scenario: Submit the selected animal's problem with partial answers, then exercise the file retry case.
    expected: A blank problem prevents submission. The submitted body contains the proposed time and answered question with no visit type. Retrying a failed file creates no second request.
    oracle: Booking by Problem PRD and fixed request payload and upload sequence asserted in the component tests.
    level: integration
    core_smoke: false
    environment: owner_dom
    real: [Visit form, React DOM interaction]
    stubbed: [Owner API methods]
    data: Synthetic pet, two questionnaire items and in-memory uploads.
    triggers: [local_change, pull_request]
    blocking_on: []
    safe_in_production: false
    status: implemented
    test_ref: tests/integration/visit-request-form.test.tsx
    owner: unassigned
  - id: CHECK-OWNER-PROXY
    feature_id: FEAT-OWNER-PROXY
    capability_ids: [CAP-OWNER-PROXY]
    scenario: Stream a private owner file through the proxy handler with synthetic staff and owner credentials in the request.
    expected: Only the owner cookie reaches the upstream request. The file bytes are preserved and Cache-Control is no-store.
    oracle: Owner proxy contract in docs/architecture/owner-web.md and independently specified input cookies and stubbed response bytes.
    level: integration
    core_smoke: false
    environment: owner_proxy
    real: [Owner proxy handler, NextRequest, Response stream]
    stubbed: [Upstream fetch]
    data: Synthetic cookies and in-memory PDF response.
    triggers: [local_change, pull_request]
    blocking_on: []
    safe_in_production: false
    status: implemented
    test_ref: tests/secure/owner-boundary.test.ts
    owner: unassigned
  - id: CHECK-OWNER-CABINET-TO-VISIT
    feature_id: FEAT-OWNER-CABINET-TO-VISIT
    capability_ids: [CAP-OWNER-CLINIC-SESSION, CAP-OWNER-VISIT]
    scenario: In a browser, sign in via a clinic invitation, submit a request for that clinic's pet and reload the cabinet.
    expected: The invited clinic opens. The chosen pet shows one persisted request with the submitted problem and time, in requested status with no confirmed time or visit type. The other pet has no requests.
    oracle: Clinic-link and Booking by Problem contracts, fixed clinic and pet fixtures, and separate reads of both pets' requests after navigation.
    level: e2e
    core_smoke: true
    environment: owner_browser
    real: [Browser, Next.js application and owner proxy, FastAPI, PostgreSQL]
    stubbed: []
    data: Seeded disposable clinic, unique synthetic owner, two pets, and a synthetic problem and proposed time.
    triggers: *core_events
    blocking_on: *core_events
    safe_in_production: false
    status: implemented
    test_ref: tests/e2e/test_cabinet_to_visit.py
    owner: unassigned
impact_rules:
  - paths: [packages/owner-features/src/platform, packages/owner-features/src/api.ts, packages/api-client/src/http.ts]
    checks: [CHECK-OWNER-CLINIC-SIGN-IN, CHECK-OWNER-VISIT-FORM, CHECK-OWNER-CABINET-TO-VISIT]
  - paths: [apps/owner-web/src/app/api, packages/web-proxy/src, apps/owner-web/tests/secure/owner-boundary.test.ts]
    checks: [CHECK-OWNER-PROXY, CHECK-OWNER-CABINET-TO-VISIT]
  - paths: [apps/owner-web/tests/integration/owner-scenarios.test.tsx]
    checks: [CHECK-OWNER-CLINIC-SIGN-IN]
  - paths: [apps/owner-web/tests/integration/visit-request-form.test.tsx]
    checks: [CHECK-OWNER-VISIT-FORM]
  - paths: [apps/owner-web/tests/e2e/test_cabinet_to_visit.py, packages/owner-features/src/components/visit-request-form.tsx]
    checks: [CHECK-OWNER-CABINET-TO-VISIT]
metadata:
  discovery: PROJECT_CONTEXT_MISSING at apps/owner-web/docs/PROJECT.md. Shared docs/PROJECT.md, architecture and PRDs were used as repository evidence.
  references: Feature and impact paths are repository-relative. Test references are relative to apps/owner-web.
  reconciliation: The browser check collects as tests/e2e/test_cabinet_to_visit.py::test_owner_signs_in_and_request_survives_cabinet_reload.
