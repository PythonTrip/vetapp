name: CI
on:
  push:
  pull_request:
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/api --frozen --all-groups
      - run: pnpm api:check
      - run: pnpm --filter @vetdietderm/api-client typecheck
      - run: pnpm --filter @vetdietderm/api-client test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:web
      - run: pnpm build
        env:
          DOCKER_BUILD: '1'
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vetapp_test
          POSTGRES_USER: vetapp
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetapp -d vetapp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vetapp:test-only@127.0.0.1:5432/vetapp_test
      AUTH_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          python-version: '3.13'
      - run: uv sync --directory apps/api --frozen --all-groups
      - run: uv run --directory apps/api --frozen alembic upgrade head
      - run: uv run --directory apps/api --frozen pytest
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet
      - run: docker build -t vetapp-api -f infra/docker/api.Dockerfile apps/api
      - run: docker build -t vetapp-frontend -f infra/docker/clinic-web.Dockerfile .
