name: vetapp

services:
  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    container_name: vetapp-api
    restart: unless-stopped

    environment:
      DATABASE_ADDRESS: ${DATABASE_ADDRESS:?Set DATABASE_ADDRESS in .env}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-prefer}

      MODULE_AUTH_URL: ${MODULE_AUTH_URL:?Set MODULE_AUTH_URL reachable from the API container}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      OWNER_COOKIE_SAMESITE: ${OWNER_COOKIE_SAMESITE:-lax}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-300}
      FRONTEND_URL: ${FRONTEND_URL:-https://vetapp.syndex-ai.ru}
      OWNER_FRONTEND_URL: ${OWNER_FRONTEND_URL:-${FRONTEND_URL:-https://vetapp.syndex-ai.ru}}
      API_ALLOWED_ORIGINS: '${API_ALLOWED_ORIGINS:-[]}'
      ATTACHMENT_DIR: /data/attachments

    networks:
      shared:
        aliases:
          - vetapp-api

    # Loopback only — nginx must not proxy here; Next.js reaches API via Docker DNS.
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"

    volumes:
      - attachments:/data/attachments

    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn vetdietderm_api.main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from vetdietderm_api.db import ping_database; ping_database()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/clinic-web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://vetapp-api:8000}

    container_name: vetapp-frontend
    restart: unless-stopped

    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://vetapp.syndex-ai.ru}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://vetapp-api:8000}

    networks:
      shared:
        aliases:
          - vetapp-frontend

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3003}:3000"

    depends_on:
      api:
        condition: service_healthy

  owner-web:
    profiles: [owner]
    build:
      context: ..
      dockerfile: infra/docker/owner-web.Dockerfile
      args:
        TELEGRAM_WEB_ENABLED: ${TELEGRAM_WEB_ENABLED:-false}
    restart: unless-stopped
    environment:
      OWNER_FRONTEND_URL: ${OWNER_FRONTEND_URL:-${FRONTEND_URL:-https://vetapp.syndex-ai.ru}}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://vetapp-api:8000}
    networks:
      shared:
        aliases:
          - vetapp-owner-web
    ports:
      - "127.0.0.1:${OWNER_FRONTEND_PORT:-3004}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  attachments:

networks:
  shared:
    external: true
    name: shared-backend
