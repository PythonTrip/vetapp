name: vetapp-tests
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vetapp_test
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: test-only
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetapp -d vetapp_test"]
      interval: 2s
      timeout: 5s
      retries: 30
